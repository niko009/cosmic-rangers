name: Deploy to bacus server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmic-rangers-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, bacus]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Bootstrap project if needed
        shell: bash
        run: |
          if [ ! -d "/srv/bacus/apps/cosmic-rangers" ]; then
            command -v add-bacus-project >/dev/null
            add-bacus-project \
              --name cosmic-rangers \
              --domain cosmic-rangers.bacus.dev \
              --repo niko009/cosmic-rangers \
              --port 8080
          fi

      - name: Deploy isolated project
        run: /usr/local/bin/bacus-project deploy cosmic-rangers "$GITHUB_WORKSPACE"
