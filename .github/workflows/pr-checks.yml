name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify required files
        shell: bash
        run: |
          test -f index.html
          test -f css/style.css
          test -f js/AppStorage.js
          test -f js/particles.js
          test -f js/stars.js
          test -f js/entities.js
          test -f js/game.js
          test -f js/main.js

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check local asset references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          refs = re.findall(r'(?:src|href)=["\']([^"\']+)["\']', html)
          missing = []
          for ref in refs:
              if ref.startswith(('http://', 'https://', '//', '#', 'data:')):
                  continue
              path = Path(ref.lstrip('/'))
              if not path.exists():
                  missing.append(ref)
          if missing:
              raise SystemExit('Missing local assets: ' + ', '.join(missing))
          print('Local asset references OK')
          PY
