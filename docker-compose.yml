services:
  app:
    build: .
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      bacus-net:
        aliases:
          - bacus-cosmic-rangers

networks:
  bacus-net:
    external: true
